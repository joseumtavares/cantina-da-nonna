# Criado por Jose Tavares.
# Perfil supabase: usado quando a aplicacao deve conectar no banco PostgreSQL do Supabase.
#
# IMPORTANTE:
# Nunca coloque senha real neste arquivo.
# Configure os valores reais como variaveis de ambiente no IntelliJ, VS Code,
# terminal ou plataforma de publicacao.

# --- Conexao com Supabase/PostgreSQL ---
# A URL deve usar o prefixo jdbc:postgresql:// e SSL habilitado.
# Exemplo de formato para o pooler session mode do Supabase:
# jdbc:postgresql://aws-[REGIAO].pooler.supabase.com:5432/postgres?sslmode=require
#
# Usuario do pooler normalmente segue o formato:
# postgres.[PROJECT_REF]
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Inicializacao automatica do banco no Supabase ---
# Estes scripts usam sintaxe PostgreSQL, diferente dos scripts MySQL locais.
# Em producao real, podemos mudar SUPABASE_SQL_INIT_MODE para never depois das tabelas criadas.
spring.sql.init.mode=${SUPABASE_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema-postgres.sql
spring.sql.init.data-locations=classpath:db/data-postgres.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false