# Criado por Jose Tavares.
# Perfil Supabase usado quando a aplicação deve conectar no PostgreSQL hospedado fora do computador local.

# --- Segurança das credenciais ---
# Nunca coloque senha real neste arquivo.
# Informe SUPABASE_DB_URL, SUPABASE_DB_USERNAME e SUPABASE_DB_PASSWORD por variáveis de ambiente na IDE, no terminal ou no deploy.

# --- Conexão com Supabase/PostgreSQL ---
# A URL precisa usar jdbc:postgresql:// e sslmode=require.
# Para desenvolvimento sem depender de IPv6, usamos o Session pooler do Supabase.
# Formato esperado: jdbc:postgresql://aws-[REGIAO].pooler.supabase.com:5432/postgres?sslmode=require
# Usuário do pooler: postgres.[PROJECT_REF]
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Inicialização automática do banco no Supabase ---
# Estes scripts usam PostgreSQL, diferente dos scripts MySQL locais.
# Em um ambiente publicado, depois que as tabelas estiverem criadas, troque SUPABASE_SQL_INIT_MODE para never.
spring.sql.init.mode=${SUPABASE_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema-postgres.sql
spring.sql.init.data-locations=classpath:db/data-postgres.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# O script PostgreSQL tem funções PL/pgSQL com ponto e vírgula interno.
# O separador próprio evita que o Spring divida a função no meio durante a execução do script.
spring.sql.init.separator=^^^
