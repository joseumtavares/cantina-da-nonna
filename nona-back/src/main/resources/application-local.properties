# Perfil local usado nas aulas e no desenvolvimento com XAMPP/MySQL ou MariaDB.

# --- Conexão local com MySQL/MariaDB ---
# As variáveis de ambiente permitem trocar usuário, senha ou URL sem editar este arquivo.
# Os valores depois dos dois-pontos são os padrões para rodar no computador local durante o estudo.
# Configuração simples da aula, mantida como referência:
# spring.datasource.url=jdbc:mysql://localhost:3306/nona-db
# spring.datasource.username=root
# spring.datasource.password=root
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/nona-db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Inicialização automática do banco local ---
# Estes scripts usam sintaxe MySQL/MariaDB e recriam dados iniciais de forma segura para estudo.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
