# Criado por Jose Tavares.
# Este arquivo reúne configurações comuns do back-end e vale para IntelliJ, VS Code e Maven.

spring.application.name=nona-back

# --- Perfis de ambiente ---
# O perfil local continua sendo o padrão para estudo com XAMPP/MySQL.
# Para conectar no Supabase/PostgreSQL, defina SPRING_PROFILES_ACTIVE=supabase no terminal, na IDE ou na plataforma de deploy.
spring.profiles.default=local

# --- Variáveis locais opcionais ---
# O Spring tenta carregar arquivos .env quando eles existem, mas esses arquivos nunca devem ir para o Git.
# Assim conseguimos usar senhas reais no computador local sem expor credenciais no código versionado.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:nona-back/.env[.properties]

# --- Actuator / Health ---
# Durante o desenvolvimento, detalhes do /actuator/health ajudam a enxergar rapidamente falhas de banco ou configuração.
management.endpoint.health.show-details=always

# --- Front-end estático ---
# O Spring Boot também entrega os arquivos do front-end para facilitar o acesso pelo mesmo servidor.
# Mantemos dois caminhos porque o back-end pode ser iniciado dentro de nona-back ou a partir da raiz nonna.
# O classpath:/static/ permanece disponível para arquivos internos que venham a ser adicionados no futuro.
spring.web.resources.static-locations=classpath:/static/,file:../nona-front/public/,file:nona-front/public/
