# Criado por Jose Tavares.
# Referencia da aula: SENAC_back/src/main/resources/application.properties

spring.application.name=nona-back

# --- Perfis de ambiente ---
# Por padrao o projeto roda com o perfil local, usando XAMPP/MySQL.
# Para usar Supabase/PostgreSQL, configure SPRING_PROFILES_ACTIVE=supabase
# no IntelliJ, no VS Code, no terminal ou no ambiente de publicacao.
spring.profiles.default=local

# --- Arquivo opcional de variaveis locais ---
# O Spring tenta carregar .env quando existir, mas o arquivo real nao deve ir para o Git.
# Isso ajuda a usar credenciais locais sem alterar o codigo versionado.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Actuator / Health ---
# Melhoria criada por Jose Tavares:
# mostra detalhes do /actuator/health durante o desenvolvimento.
management.endpoint.health.show-details=always

# --- Front-end estatico ---
# Criado por Jose Tavares.
# Esta configuracao permite que o Spring Boot entregue os arquivos HTML, CSS,
# JavaScript e imagens que estao na pasta nona-front/public.
#
# file:../nona-front/public/ funciona quando o back-end e iniciado dentro da pasta nona-back.
# file:nona-front/public/ funciona quando o back-end e iniciado a partir da pasta raiz nonna.
# classpath:/static/ fica como opcao padrao do Spring Boot para arquivos internos futuros.
spring.web.resources.static-locations=classpath:/static/,file:../nona-front/public/,file:nona-front/public/