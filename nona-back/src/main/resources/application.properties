# Referencia da aula: SENAC_back/src/main/resources/application.properties

spring.application.name=nona-back

# --- Conexao com o banco de dados ---
# O Spring le estas linhas e cria o pool de conexoes sozinho.
# Nao e preciso escrever codigo Java para abrir conexao manualmente.
#
# Configuracao da aula:
# spring.datasource.url=jdbc:mysql://localhost:3306/nonna-db
# spring.datasource.username=root
# spring.datasource.password=root
#
# Melhoria criada por Jose Tavares:
# usamos variaveis de ambiente com valor padrao. Assim o mesmo codigo roda
# no IntelliJ IDEA, no Visual Studio Code e pelo Maven sem quebrar.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/nona-db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Inicializacao automatica do banco ---
# Melhoria criada por Jose Tavares:
# o Spring executa schema.sql e data.sql ao iniciar a aplicacao.
# Isso evita depender apenas de scripts manuais no Workbench/phpMyAdmin.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# --- Actuator / Health ---
# Melhoria criada por Jose Tavares:
# mostra detalhes do /actuator/health durante o desenvolvimento.
management.endpoint.health.show-details=always